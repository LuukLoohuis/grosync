    <script>
      // Set the dark class before the first paint, so a dark phone never flashes white.
      try {
        var theme = localStorage.getItem('couplecart-theme');
        if (theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
